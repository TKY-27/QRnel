name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - name: Install guest toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          curl -fsSL https://www.nasm.us/pub/nasm/releasebuilds/3.02/nasm-3.02.tar.xz -o "$RUNNER_TEMP/nasm.tar.xz"
          echo "87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d  $RUNNER_TEMP/nasm.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/nasm.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nasm-3.02"
          ./configure --prefix="$RUNNER_TEMP/nasm"
          make -j2
          make install
          echo "$RUNNER_TEMP/nasm/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.99.1 --profile minimal --component llvm-tools,rustfmt --target i586-unknown-linux-gnu
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify release
        run: |
          make test
          rustfmt --check kernel/*.rs
          git diff --exit-code -- release/
          test -z "$(git status --porcelain --untracked-files=all -- release/)"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
